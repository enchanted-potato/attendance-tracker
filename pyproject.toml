[project]
name = "attendance-tracker"
version = "0.1.0"
description = "Track office attendance against a quarterly target (e.g. 60% of working days)."
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
attendance = "attendance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attendance*"]
